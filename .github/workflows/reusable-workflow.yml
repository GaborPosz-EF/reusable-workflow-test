name: Reusable Workflow

on:
  workflow_call:
    secrets:
      test-input-secret:
        required: true

jobs:
  print-secret-job:
    runs-on: ubuntu-latest
    environment: test-environment
    steps:
      - name: print-secret-step-from-called
        env:
          INPUT_SECRET: ${{ secrets.test-input-secret }}
          REPO_SECRET: ${{ secrets.TEST_REPOSITORY_SECRET }}
          ENV_SECRET: ${{ secrets.TEST_ENVIRONMENT_SECRET }}
        run: |
          echo "Input secret (reversed): $(echo $INPUT_SECRET | rev)"
          echo "Repository secret (reversed): $(echo $REPO_SECRET | rev)"
          echo "Environment secret (reversed): $(echo $ENV_SECRET | rev)"

