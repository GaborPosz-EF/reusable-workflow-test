name: Reusable Workflow

on:
  workflow_call:
    secrets:
      test-input-secret:
        required: true

jobs:
  print-secret-job:
    runs-on: ubuntu-latest
    environment: test-environment
    steps:
      - name: print-secret-step
        run: |
          echo "Environment secret: ${{ secrets.TEST_SECRET }}"
          echo "Input secret: ${{ secrets.test-input-secret }}"

