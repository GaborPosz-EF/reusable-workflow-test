name: Reusable Workflow

on:
  workflow_call:
    secrets:
      test-input-secret:
        required: true

jobs:
  print-secret-job:
    runs-on: ubuntu-latest
    environment: test-environment
    steps:
      - name: print-secret-step
        env:
          INPUT_SECRET: ${{ secrets.test-input-secret }}
          REPO_SECRET: ${{ secrets.TEST_REPOSITORY_SECRET }}
          ENV_SECRET: ${{ secrets.TEST_ENVIRONMENT_SECRET }}
        run: |
          echo "Input secret: $INPUT_SECRET"
          echo "Repository secret: $REPO_SECRET"
          echo "Environment secret: $ENV_SECRET"

